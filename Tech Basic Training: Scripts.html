<script>
  let appState = {
    email: '',
    firstName: '',
    currentIndex: 0,
    scenarioOrder: [
      'q1_windows_settings',
      'q2_windows_update_menu',
      'q3_windows_check_updates',
      'q4_windows_install_updates',
      'q5_vantage_system_update',
      'q6_vantage_check_updates',
      'q7_vantage_install',
      'q8_audio_keys',
      'q9_manual_device_keys',
      'q10_screenshot'
    ],
    scenarios: {},
    results: {},
    details: {}
  };

  document.addEventListener('DOMContentLoaded', () => {
    google.script.run
      .withSuccessHandler(initApp)
      .withFailureHandler((err) => {
        document.getElementById('welcome').textContent =
          'Could not load the app: ' + (err && err.message ? err.message : 'Unknown error');
      })
      .getAppBootstrap();

    document.getElementById('startBtn').addEventListener('click', () => {
      document.getElementById('welcomeCard').classList.add('hidden');
      document.getElementById('moduleArea').classList.remove('hidden');
      renderCurrentScenario();
    });
  });

  function initApp(data) {
    appState.email = data.email || '';
    appState.firstName = data.firstName || 'there';
    appState.scenarios = data.scenarios || {};

    const welcome = data.email
      ? `Welcome, ${appState.firstName}. Click start to begin your training check.`
      : 'Welcome. We could not confirm your email automatically, but you can still begin.';

    document.getElementById('welcome').textContent = welcome;
  }

  function renderCurrentScenario() {
    const area = document.getElementById('moduleArea');
    const key = appState.scenarioOrder[appState.currentIndex];
    const scenario = appState.scenarios[key];

    if (!scenario) {
      renderCompletion();
      return;
    }

    if (scenario.type === 'single-hotspot') {
      renderSingleHotspotScenario(area, key, scenario);
    } else if (scenario.type === 'action-key-check') {
      renderActionKeyScenario(area, key, scenario);
    } else if (scenario.type === 'manual-device-check') {
      renderManualDeviceCheckScenario(area, key, scenario);
    } else if (scenario.type === 'confirmation') {
      renderConfirmationScenario(area, key, scenario);
    } else {
      area.innerHTML = `
        <div class="card">
          <h2>Error</h2>
          <p>Unknown scenario type: ${scenario.type}</p>
        </div>
      `;
    }
  }

  function renderSingleHotspotScenario(area, key, scenario) {
    area.innerHTML = `
      <div class="card">
        <h2>${scenario.title}</h2>
        <p>${scenario.instruction}</p>
        <div class="scenario-image-wrap" id="imageWrap"></div>
        <div class="status" id="statusText">Click the correct area to continue.</div>
      </div>
    `;

    const imageWrap = document.getElementById('imageWrap');
    const statusEl = document.getElementById('statusText');

    const img = document.createElement('img');
    img.className = 'scenario-image';
    img.src = scenario.image;
    img.alt = scenario.instruction;
    imageWrap.appendChild(img);

    scenario.hotspots.forEach((h) => {
      const el = document.createElement('div');
      el.className = 'hotspot';
      el.title = h.label;
      el.style.left = h.x + '%';
      el.style.top = h.y + '%';
      el.style.width = h.w + '%';
      el.style.height = h.h + '%';

      el.addEventListener('click', () => {
        if (h.correct !== true) {
          statusEl.textContent = 'That was not the correct option. Try again.';
          statusEl.className = 'status error';
          return;
        }

        appState.results[key] = 'PASS';
        appState.details[key] = {
          clickedHotspot: h.id,
          image: scenario.image,
          successImage: scenario.successImage || '',
          nextQuestion: scenario.nextQuestion || ''
        };

        if (scenario.successImage) {
          img.src = scenario.successImage;
        }

        statusEl.textContent = 'Success.';
        statusEl.className = 'status success';

        setTimeout(nextScenario, 600);
      });

      imageWrap.appendChild(el);
    });
  }

  function renderActionKeyScenario(area, key, scenario) {
    const pressed = new Set();

    area.innerHTML = `
      <div class="card">
        <h2>${scenario.title}</h2>
        <p>${scenario.instruction}</p>
        <div id="keysWrap"></div>
        <p class="status" id="keyStatus">Press each top-row key while this page is focused.</p>
        <p id="debugKeyText" style="margin-top:12px; font-family:monospace;">Detected key: none</p>
        <div class="button-row">
          <button class="secondary" id="skipAudioBtn">I could not complete this on this device</button>
        </div>
      </div>
    `;

    const keysWrap = document.getElementById('keysWrap');

    scenario.requiredKeys.forEach((keyName) => {
      const pill = document.createElement('span');
      pill.className = 'key-pill';
      pill.id = `pill-${keyName}`;
      pill.textContent = scenario.keyLabels?.[keyName] || keyName;
      keysWrap.appendChild(pill);
    });

    function normalizeKey(eventKey) {
      const aliases = {
        VolumeMute: 'AudioVolumeMute',
        VolumeDown: 'AudioVolumeDown',
        VolumeUp: 'AudioVolumeUp',
        AudioMute: 'AudioVolumeMute'
      };

      return aliases[eventKey] || eventKey;
    }

    function onKeyDown(e) {
      const debug = document.getElementById('debugKeyText');
      debug.textContent = `Detected key: ${e.key} | code: ${e.code}`;

      if (e.key === 'Fn') {
        return;
      }

      const normalized = normalizeKey(e.key);

      if (scenario.requiredKeys.includes(normalized)) {
        pressed.add(normalized);

        const pill = document.getElementById(`pill-${normalized}`);
        if (pill) {
          pill.classList.add('hit');
        }

        const status = document.getElementById('keyStatus');
        status.textContent = `Detected: ${scenario.keyLabels?.[normalized] || normalized}`;
        status.className = 'status success';
      }

      if (scenario.requiredKeys.every((requiredKey) => pressed.has(requiredKey))) {
        window.removeEventListener('keydown', onKeyDown);

        appState.results[key] = 'PASS';
        appState.details[key] = {
          detectedKeys: Array.from(pressed)
        };

        document.getElementById('keyStatus').textContent = 'Success.';
        document.getElementById('keyStatus').className = 'status success';

        setTimeout(nextScenario, 700);
      }
    }

    window.addEventListener('keydown', onKeyDown);

    document.getElementById('skipAudioBtn').addEventListener('click', () => {
      window.removeEventListener('keydown', onKeyDown);

      appState.results[key] = 'FAIL';
      appState.details[key] = {
        note: 'User could not complete the automatic speaker key test on this device.'
      };

      nextScenario();
    });
  }

  function renderManualDeviceCheckScenario(area, key, scenario) {
    area.innerHTML = `
      <div class="card">
        <h2>${scenario.title}</h2>
        <p>${scenario.instruction}</p>
        <div id="manualChecklist" style="margin-top:16px;"></div>
        <textarea id="manualDeviceNotes" placeholder="Optional: add any notes here."></textarea>
        <div class="button-row">
          <button id="manualDoneBtn">I completed these checks</button>
          <button class="secondary" id="manualFailBtn">I could not complete these checks</button>
        </div>
      </div>
    `;

    const checklistWrap = document.getElementById('manualChecklist');

    (scenario.checklist || []).forEach((item) => {
      const row = document.createElement('div');
      row.style.marginBottom = '10px';
      row.innerHTML = `
        <label style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" class="manual-check-item" value="${escapeHtml(item)}">
          <span>${escapeHtml(item)}</span>
        </label>
      `;
      checklistWrap.appendChild(row);
    });

    document.getElementById('manualDoneBtn').addEventListener('click', () => {
      const checkedItems = Array.from(document.querySelectorAll('.manual-check-item:checked'))
        .map((el) => el.value);

      appState.results[key] = checkedItems.length === (scenario.checklist || []).length ? 'PASS' : 'PARTIAL';
      appState.details[key] = {
        checkedItems: checkedItems,
        notes: document.getElementById('manualDeviceNotes').value || ''
      };

      nextScenario();
    });

    document.getElementById('manualFailBtn').addEventListener('click', () => {
      const checkedItems = Array.from(document.querySelectorAll('.manual-check-item:checked'))
        .map((el) => el.value);

      appState.results[key] = 'FAIL';
      appState.details[key] = {
        checkedItems: checkedItems,
        notes: document.getElementById('manualDeviceNotes').value || ''
      };

      nextScenario();
    });
  }

  function renderConfirmationScenario(area, key, scenario) {
    area.innerHTML = `
      <div class="card">
        <h2>${scenario.title}</h2>
        <p>${scenario.instruction}</p>
        <textarea id="pasteEvidence" placeholder="Please Type 'Completed' here if you were able to take a screenshot. Screenshots are found in the Pictures > Screenshots folder on your computer. If you could not take a screenshot, please explain why."></textarea>
        <div class="button-row">
          <button id="confirmDoneBtn">I completed this task</button>
          <button class="secondary" id="markFailedBtn">I could not complete this</button>
        </div>
      </div>
    `;

    document.getElementById('confirmDoneBtn').addEventListener('click', () => {
      appState.results[key] = 'PASS';
      appState.details[key] = {
        evidence: document.getElementById('pasteEvidence').value || ''
      };
      nextScenario();
    });

    document.getElementById('markFailedBtn').addEventListener('click', () => {
      appState.results[key] = 'FAIL';
      appState.details[key] = {
        evidence: document.getElementById('pasteEvidence').value || ''
      };
      nextScenario();
    });
  }

  function nextScenario() {
    appState.currentIndex += 1;

    if (appState.currentIndex >= appState.scenarioOrder.length) {
      renderCompletion();
      return;
    }

    renderCurrentScenario();
  }

  function renderCompletion() {
    const area = document.getElementById('moduleArea');
    const score = Object.values(appState.results)
      .filter((v) => v === 'PASS' || v === 'ALT-COMPLETE')
      .length;

    area.innerHTML = `
      <div class="card">
        <h2>All done</h2>
        <p>Click below to submit your results.</p>
        <button id="submitResultsBtn">Submit results</button>
        <p id="submitStatus" class="status"></p>
      </div>
    `;

    document.getElementById('submitResultsBtn').addEventListener('click', () => {
      google.script.run
        .withSuccessHandler(() => {
          document.getElementById('submitStatus').textContent = 'Results submitted successfully.';
          document.getElementById('submitStatus').className = 'status success';
        })
        .withFailureHandler((err) => {
          document.getElementById('submitStatus').textContent =
            'Could not submit results: ' + (err && err.message ? err.message : 'Unknown error');
          document.getElementById('submitStatus').className = 'status error';
        })
        .saveResults({
          email: appState.email,
          firstName: appState.firstName,
          results: appState.results,
          score: score,
          details: appState.details
        });
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
</script>
